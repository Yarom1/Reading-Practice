name: ASR check

# Diagnostic: a Hebrew speech recognizer listens to the recorded lines and lists the words it does
# not hear as written (tools/voice/asr_check.py). Does not change the app.
on:
  push:
    paths:
      - "tools/voice/asr_check.py"
      - ".github/workflows/asr-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper miniaudio numpy imageio-ffmpeg

      - name: Compare
        id: compare
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p g2p-out
          python tools/voice/asr_check.py --assets app/src/main/assets --out g2p-out 2>&1 | tee g2p-out/run.log

      - name: Encode MP3
        if: always()
        run: |
          FF=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          cd g2p-out
          for f in *.wav; do
            [ -e "$f" ] || continue
            "$FF" -loglevel error -y -i "$f" -ac 1 -b:a 64k "${f%.wav}.mp3" && rm "$f"
          done
          echo "compare=${{ steps.compare.outcome }} sha=${GITHUB_SHA} run=${GITHUB_RUN_NUMBER}" > STATUS.txt

      - name: Publish output branch
        if: always()
        run: |
          BRANCH="build-output/${GITHUB_REF_NAME}-asr"
          rm -rf /tmp/out && mkdir -p /tmp/out && cp -r g2p-out/. /tmp/out/
          cd /tmp/out
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ASR check ${GITHUB_RUN_NUMBER} of ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
